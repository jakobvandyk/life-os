function makeSVGVar(iconGrid, dim, size, color = '#e8dcc8') {
  let rects = '';
  iconGrid.forEach((val, i) => {
    if (!val) return;
    const x = i % dim;
    const y = Math.floor(i / dim);
    rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color}" shape-rendering="crispEdges"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

// Render grid resolution section
function renderGridSection(title, variants) {
  let h = `<hr class="divider"><h2>${title} — Grid Resolution Comparison</h2>`;

  // Show all at same render size (32px) to compare detail
  h += '<p style="font-size:10px;color:#5c5345;margin-bottom:12px">All rendered at 32px — comparing pixel detail, not display size</p>';
  h += '<div class="row">';
  Object.entries(variants).forEach(([label, v]) => {
    h += `<div class="sample">${makeSVGVar(v.grid, v.dim, 32)}<span class="label">${label}</span><span class="context">${v.dim}x${v.dim} = ${v.dim*v.dim} cells</span></div>`;
  });
  h += '</div>';

  // Show at native-feeling sizes (2px per cell)
  h += '<p style="font-size:10px;color:#5c5345;margin:16px 0 12px">Rendered at 2px per cell — natural pixel scale</p>';
  h += '<div class="row">';
  Object.entries(variants).forEach(([label, v]) => {
    const nativeSize = v.dim * 2;
    h += `<div class="sample">${makeSVGVar(v.grid, v.dim, nativeSize)}<span class="label">${label}</span><span class="context">${nativeSize}px</span></div>`;
  });
  h += '</div>';

  // Show at 3px per cell
  h += '<p style="font-size:10px;color:#5c5345;margin:16px 0 12px">Rendered at 3px per cell</p>';
  h += '<div class="row">';
  Object.entries(variants).forEach(([label, v]) => {
    const sz = v.dim * 3;
    h += `<div class="sample">${makeSVGVar(v.grid, v.dim, sz)}<span class="label">${label}</span><span class="context">${sz}px</span></div>`;
  });
  h += '</div>';

  // In-context: sidebar at 14px
  h += '<p style="font-size:10px;color:#5c5345;margin:16px 0 12px">In sidebar context (14px render)</p>';
  Object.entries(variants).forEach(([label, v]) => {
    h += `<div style="margin-bottom:4px"><span class="label" style="display:inline-block;width:80px;text-align:right;margin-right:12px">${label}</span><span class="sidebar-item">${makeSVGVar(v.grid, v.dim, 14, '#a89880')} Dashboard</span></div>`;
  });

  // In-context: page header at 18px
  h += '<p style="font-size:10px;color:#5c5345;margin:16px 0 12px">In page header context (18px render)</p>';
  Object.entries(variants).forEach(([label, v]) => {
    h += `<div style="margin-bottom:8px"><span class="label" style="display:inline-block;width:80px;text-align:right;margin-right:12px">${label}</span><span class="header">${makeSVGVar(v.grid, v.dim, 18)} Dashboard</span></div>`;
  });

  document.write(h);
}
